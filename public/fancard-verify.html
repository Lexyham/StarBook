<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0c">
<meta name="description" content="Check the current status of a StarBook fan membership card.">
<title>Fan Card Verification - StarBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/fan-cards.css">
<style>
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0,rgba(203,162,69,.12),transparent 45%),#090a0c;color:#f8f5ec;font-family:Inter,Arial,sans-serif}
.fan-verify{width:min(100% - 32px,720px);margin:0 auto;padding:38px 0 56px}
.fan-verify__brand{display:inline-block;margin-bottom:22px;color:#e5c46f;font-weight:900;letter-spacing:.14em;text-decoration:none}
.fan-verify__panel{padding:clamp(22px,5vw,40px);border:1px solid rgba(216,173,79,.3);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 24px 70px rgba(0,0,0,.32)}
.fan-verify__eyebrow{margin:0 0 12px;color:#d9bd76;font-size:.68rem;font-weight:800;letter-spacing:.15em}
.fan-verify__panel h1{margin:12px 0 8px;font-size:clamp(1.4rem,5vw,2rem);line-height:1.15;overflow-wrap:anywhere}
.fan-verify__intro,.fan-verify__privacy{color:#bdb8aa;font-size:.84rem;line-height:1.6}
.fan-verify__status{display:inline-flex;padding:7px 11px;border:1px solid;border-radius:999px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.fan-verify__status--active{border-color:rgba(126,220,153,.3);background:rgba(46,160,80,.12);color:#8ee0a8}
.fan-verify__status--pending{border-color:rgba(241,206,117,.3);background:rgba(180,130,30,.12);color:#f1ce75}
.fan-verify__status--rejected{border-color:rgba(241,161,161,.28);background:rgba(180,60,60,.12);color:#f1a1a1}
.fan-verify__card{margin:22px 0}
.fan-verify__details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
.fan-verify__details div{min-width:0;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:rgba(0,0,0,.16)}
.fan-verify__details dt{margin-bottom:5px;color:#bdb8aa;font-size:.65rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.fan-verify__details dd{margin:0;color:#fff;font-size:.84rem;line-height:1.45;overflow-wrap:anywhere}
.fan-verify__privacy{margin:18px 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:.74rem}
@media(max-width:480px){.fan-verify{padding-top:22px}.fan-verify__details{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#111}.fan-verify{width:100%;padding:0}.fan-verify__brand{display:none}.fan-verify__panel{box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="fan-verify">
  <a class="fan-verify__brand" href="/index.html">✦ STARBOOK</a>
  <div id="fanCardVerification" aria-live="polite">
    <section class="fan-verify__panel" role="status">Checking current card status…</section>
  </div>
</main>
<script src="/assets/js/fan-card-templates.js"></script>
<script src="/assets/js/fan-card-verify.js"></script>
</body>
</html>
