<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Page not found - StarBook">
<title>404 - Page Not Found | StarBook</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0F;--bg2:#111118;--surface:#1A1A24;--border:rgba(255,255,255,.07);--gold:#F5C842;--text:#F0F0F5;--text2:rgba(240,240,245,.7);--text3:rgba(240,240,245,.4);--accent2:#7C5CFC;--font-head:'Syne',sans-serif;--font-body:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;overflow-y:auto;position:relative;padding:24px 0}
canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.content{position:relative;z-index:1;text-align:center;padding:clamp(24px,6vw,40px) clamp(16px,5vw,24px);width:min(100%,520px)}
.logo-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--font-head);font-size:1.2rem;font-weight:800;color:var(--gold);margin-bottom:48px}
.num-404{font-family:var(--font-head);font-size:clamp(6rem,18vw,9rem);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--gold) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.glow-ring{width:240px;height:240px;border-radius:50%;border:1px solid rgba(245,200,66,.15);box-shadow:0 0 60px rgba(245,200,66,.08),inset 0 0 60px rgba(245,200,66,.04);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
.heading{font-family:var(--font-head);font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;margin:8px 0 14px}
.sub{color:var(--text2);font-size:.95rem;line-height:1.7;margin-bottom:36px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:10px;font-size:.9rem;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:.15s;font-family:var(--font-body)}
.btn-gold{background:var(--gold);color:#0A0A0F}
.btn-gold:hover{background:#ffd85e}
.btn-outline{border:1.5px solid var(--border);background:var(--surface);color:var(--text2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.back-link{margin-top:28px;font-size:.82rem;color:var(--text3)}
.back-link a{color:var(--text3);text-decoration:none}
.back-link a:hover{color:var(--gold)}
@media(max-width:480px){.logo-link{margin-bottom:32px}.num-404{font-size:clamp(5rem,28vw,7rem)}.sub{font-size:.88rem;margin-bottom:24px}.actions{flex-direction:column;align-items:stretch}.actions .btn{justify-content:center}}
@media(orientation:landscape) and (max-height:500px){body{align-items:flex-start}.content{padding-block:20px}.logo-link{margin-bottom:20px}.num-404{font-size:clamp(4rem,18vh,6rem)}.sub{margin-bottom:18px}.glow-ring{width:180px;height:180px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow-ring"></div>
<div class="content">
  <a href="/index.html" class="logo-link">⭐ <span style="color:var(--text)">Star</span>Book</a>
  <div style="position:relative;display:inline-block">
    <div class="num-404">404</div>
  </div>
  <h1 class="heading">Page Not Found</h1>
  <p class="sub">The star you're looking for has left the stage. This page doesn't exist or may have been moved.</p>
  <div class="actions">
    <a href="/index.html" class="btn btn-gold">🏠 Go Home</a>
    <a href="/celebrities.html" class="btn btn-outline">⭐ Browse Celebrities</a>
    <a href="/help.html" class="btn btn-outline">💬 Get Support</a>
  </div>
  <p class="back-link">or <a href="javascript:history.back()">go back to the previous page</a></p>
</div>
<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); initStars(); });
function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 4000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.4 + 0.2, alpha: Math.random(), speed: Math.random() * 0.004 + 0.001, phase: Math.random() * Math.PI * 2 });
  }
}
initStars();
let frame = 0;
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  frame++;
  stars.forEach(s => {
    s.alpha = 0.2 + 0.5 * Math.abs(Math.sin(s.phase + frame * s.speed));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(245,200,66,${s.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
